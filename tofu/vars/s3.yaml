---
- name: hp-dev
  lifecycle_rule:
    - id: "logs"
      enabled: true
      transition:
        - days: 30
          storage_class: "STANDARD_IA"
        - days: 60
          storage_class: "GLACIER"
      expiration:
        days: 90
      filter:
        prefix: "logs/"
    - id: "logs_at_root" 
      enabled: true
      filter:
        prefix: "E2B46Z10ZSO418."
      expiration:
        days: 30
    - id: "static"
      enabled: true
      filter:
        prefix: "static/"
      noncurrent_version_expiration:
        days: 30
  policy: |
    {
      "Version": "2012-10-17",
      "Id": "AllowCloudFront",
      "Statement": [
          {
              "Sid": "AllowCloudFrontPrincipal",
              "Effect": "Allow",
              "Principal": {
                  "Service": "cloudfront.amazonaws.com"
              },
              "Action": "s3:GetObject",
              "Resource": "arn:aws:s3:::${workspace}-hp-dev/*",
              "Condition": {
                  "StringEquals": {
                      "AWS:SourceArn": "arn:aws:cloudfront::${account_id}:distribution/E2B46Z10ZSO418"
                  }
              }
          }
      ]
    }
- name: nobleworkfoundation
